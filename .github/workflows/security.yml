name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run backend tests
        run: |
          cd backend
          pytest tests -q

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Run frontend build
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t recommender-backend:ci ./backend
      - name: Build frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=/api -t recommender-frontend:ci ./frontend

  publish-images:
    if: github.ref == 'refs/heads/main'
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          docker build -t ghcr.io/${OWNER_LC}/recommender-backend:${GITHUB_SHA} ./backend
          docker tag ghcr.io/${OWNER_LC}/recommender-backend:${GITHUB_SHA} ghcr.io/${OWNER_LC}/recommender-backend:latest
          docker push ghcr.io/${OWNER_LC}/recommender-backend:${GITHUB_SHA}
          docker push ghcr.io/${OWNER_LC}/recommender-backend:latest
      - name: Build and push frontend image
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          docker build --build-arg NEXT_PUBLIC_API_URL=/api -t ghcr.io/${OWNER_LC}/recommender-frontend:${GITHUB_SHA} ./frontend
          docker tag ghcr.io/${OWNER_LC}/recommender-frontend:${GITHUB_SHA} ghcr.io/${OWNER_LC}/recommender-frontend:latest
          docker push ghcr.io/${OWNER_LC}/recommender-frontend:${GITHUB_SHA}
          docker push ghcr.io/${OWNER_LC}/recommender-frontend:latest
